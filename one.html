<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Registration</title>
 <link rel="stylesheet" href="one.css">
</head>
<body>

<div class="form-container">
  <h2>Create Your Account</h2>
  
  <form action="/submit-registration" method="POST">
    
    <!-- Section 1: Personal Info -->
    <fieldset>
      <legend>Personal Information</legend>
      <div class="form-grid two-col">
        
        <div class="form-control">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="first_name" required autocomplete="given-name">
        </div>
        
        <div class="form-control">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="last_name" required autocomplete="family-name">
        </div>

        <div class="form-control">
          <label for="birth-date">Date of Birth</label>
          <input type="date" id="birth-date" name="birth_date">
        </div>

        <div class="form-control">
          <label>Gender</label>
          <div class="option-group">
            <label class="option-label">
              <input type="radio" name="gender" value="male"> Male
            </label>
            <label class="option-label">
              <input type="radio" name="gender" value="female"> Female
            </label>
            <label class="option-label">
              <input type="radio" name="gender" value="other"> Other
            </label>
          </div>
        </div>

      </div>
    </fieldset>

    <!-- Section 2: Contact & Credentials -->
    <fieldset>
      <legend>Contact & Security</legend>
      <div class="form-grid two-col">
        
        <div class="form-control">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="form-control">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="1234567890">
        </div>
        
        <div class="form-control full-width">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required autocomplete="new-password">
        </div>

        <div class="form-control full-width">
          <label for="country">Country</label>
          <select id="country" name="country" required>
            <option value="" disabled selected>Select your country</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="GB">United Kingdom</option>
            <option value="IN">India</option>
            <option value="AU">Australia</option>
          </select>
        </div>

      </div>
    </fieldset>

    <!-- Section 3: Preferences -->
    <fieldset>
      <legend>Preferences & Comments</legend>
      <div class="form-grid">
        
        <div class="form-control">
          <label for="comments">Bio / Additional Notes</label>
          <textarea id="comments" name="comments" rows="3" placeholder="Tell us a bit about yourself..."></textarea>
        </div>

        <div class="form-control">
          <label class="option-label">
            <input type="checkbox" name="terms" value="accepted" required>
            I agree to the Terms of Service and Privacy Policy.
          </label>
        </div>

      </div>
    </fieldset>

    <!-- Action Buttons -->
    <div class="form-actions">
      <button type="reset">Clear Form</button>
      <button type="submit">Submit Registration</button>
    </div>

  </form>
</div>

</body>
</html>
